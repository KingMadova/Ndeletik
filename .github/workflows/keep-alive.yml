name: Supabase Keep-Alive Ping

on:
  schedule:
    # Toutes les 5 heures (Supabase free tier dort après 1 semaine d'inactivité)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping keep-alive endpoint
        run: |
          curl -f -X GET "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/keep-alive" || \
          curl -f -X GET "https://ndeletik.vercel.app/api/keep-alive"
